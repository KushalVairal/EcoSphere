# ── Prod profile: H2 file-based database ────────────────────────────
server.port=${PORT:8080}

# H2 file database in /tmp (Render writable location)
spring.datasource.url=jdbc:h2:file:/tmp/ecosphere;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use 'create' to force table creation (fixes METRICS not found)
spring.jpa.hibernate.ddl-auto=create

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
logging.level.com.ecosphere=INFO
