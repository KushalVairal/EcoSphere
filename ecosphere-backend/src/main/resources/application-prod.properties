# ── Prod profile: H2 file-based database (no external PostgreSQL needed) ─────
server.port=${PORT:8080}

# H2 file database in /tmp (Render writable location)
spring.datasource.url=jdbc:h2:file:/tmp/ecosphere;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console enabled for debugging (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=false
logging.level.com.ecosphere=INFO
