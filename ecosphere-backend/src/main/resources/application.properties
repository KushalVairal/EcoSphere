# ── Active profile ────────────────────────────────────────────────────────────
# Use 'dev' locally (H2 in-memory). Switch to 'prod' on Render with real Postgres.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JPA common ─────────────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── JWT ────────────────────────────────────────────────────────────────────────
# IMPORTANT: override this secret in production via environment variable JWT_SECRET
jwt.secret=${JWT_SECRET:ecosphere-super-secret-key-change-this-in-production-min-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ───────────────────────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS to your Vercel URL in production
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── World Bank API ─────────────────────────────────────────────────────────────
worldbank.api.base-url=https://api.worldbank.org/v2
worldbank.api.country-limit=50

# ── Data refresh scheduler ────────────────────────────────────────────────────
# Fetch fresh World Bank data once per day at 02:00 UTC
scheduler.cron=${SCHEDULER_CRON:0 0 2 * * *}
